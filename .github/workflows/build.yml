name: Build SneakyCamTripleTap DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tweak (.deb)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide)
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide DEB
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p output
          cp packages/*.deb output/SneakyCamTripleTap_roothide.deb

      - name: List Output Files
        run: |
          ls -la output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: SneakyCam TripleTap v1.0.0 (iPhone 13 Pro Max - iOS 16 RootHide)
          body: |
            ### 📸 SneakyCam TripleTap (+) cho iPhone 13 Pro Max (iOS 16 RootHide)
            - **Tính năng:** Bấm đúng 3 lần nút Volume (+) để bắt đầu / dừng quay lén SneakyCam.
            - **Loại bỏ:** Tắt hoàn toàn tính năng giữ nút và bấm 2 lần để kích hoạt.
            - **Phản hồi:** Rung nhẹ xúc giác Taptic Engine khi kích hoạt thành công.
          files: output/*.deb
