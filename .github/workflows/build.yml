name: Build SneakyCamHoldLeft DEB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tweak (.deb)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide)
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide DEB
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p output
          cp packages/*.deb output/SneakyCamHoldLeft_roothide.deb

      - name: List Output Files
        run: |
          ls -la output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.0
          name: SneakyCam Hold Left Notch v1.1.0 (Giữ Tai Thỏ Bên Trái - Bản Final)
          body: |
            ### 📸 SneakyCam Hold Left Notch v1.1.0 (Bản Final)
            - **Kích hoạt ngầm bí mật:** Nhấn giữ tai thỏ bên trái (khu vực hiển thị Đồng hồ) để bật/tắt quay lén ngầm.
            - **Rung nhẹ xúc giác:** Taptic feedback êm ái khi nhận lệnh, không chớp màn hình.
            - **Tắt sạch phím âm lượng:** Vô hiệu hóa hoàn toàn mọi cách kích hoạt bằng phím Volume của SneakyCam gốc.
            - **Không xung đột:** Tách rời hoàn toàn với chụp màn hình (giữ tai thỏ bên phải).
          files: output/*.deb
